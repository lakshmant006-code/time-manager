<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"></head>
<body>
<div class="frame" style="background:#f8f9fa;">
  <!-- sidebar -->
  <div style="position:absolute;left:0;top:0;bottom:0;width:330px;background:#fff;border-right:1px solid #e5e7eb;padding:50px 28px 36px;">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:40px;height:46px;">
      <img src="logo-dark.png" style="height:46px;width:auto;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.15));" />
    </div>
    <div style="background:#000;color:#fff;border-radius:12px;padding:16px 20px;font-size:22px;font-weight:600;margin-bottom:28px;">Home</div>
    <div style="color:#9ca3af;font-size:15px;font-weight:600;letter-spacing:1px;margin-bottom:14px;">WORKSPACE</div>
    <div style="display:flex;flex-direction:column;gap:20px;color:#374151;font-size:21px;margin-bottom:34px;">
      <div>Organization</div><div>Clients</div><div>Projects</div><div>Activities</div><div>Skills</div><div>Time Tracking</div><div>Reports</div>
    </div>
    <div style="color:#9ca3af;font-size:15px;font-weight:600;letter-spacing:1px;margin-bottom:14px;">PEOPLE</div>
    <div style="display:flex;flex-direction:column;gap:20px;font-size:21px;">
      <div style="display:flex;align-items:center;gap:12px;color:#374151;"><span style="width:14px;height:14px;border-radius:4px;background:#1900ff;display:inline-block;"></span>Employees</div>
      <div style="display:flex;align-items:center;gap:12px;color:#374151;"><span style="width:14px;height:14px;border-radius:4px;background:#a855f7;display:inline-block;"></span>Teams</div>
      <div style="display:flex;align-items:center;gap:12px;color:#374151;"><span style="width:14px;height:14px;border-radius:4px;background:#22c55e;display:inline-block;"></span>Roles</div>
    </div>
  </div>

  <!-- main -->
  <div style="position:absolute;left:330px;right:0;top:0;bottom:0;padding:64px 80px;">
    <div style="font-size:24px;color:#6b7280;margin-bottom:10px;">Monday, September 14, 2026</div>
    <div style="font-family:'Avant Gothic','Inter',sans-serif;font-weight:600;font-size:56px;color:#111827;margin-bottom:48px;">Good afternoon, Sarah</div>

    <div style="display:flex;gap:28px;">
      <div style="flex:1;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:32px;">
        <div style="color:#6b7280;font-size:20px;margin-bottom:14px;">Active clients</div>
        <div style="font-family:'Avant Gothic','Inter',sans-serif;font-size:54px;font-weight:600;color:#111827;">2</div>
      </div>
      <div style="flex:1;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:32px;">
        <div style="color:#6b7280;font-size:20px;margin-bottom:14px;">Open projects</div>
        <div style="font-family:'Avant Gothic','Inter',sans-serif;font-size:54px;font-weight:600;color:#111827;">7</div>
      </div>
      <div style="flex:1;background:#fff;border:3px solid #1900ff;border-radius:18px;padding:32px;box-shadow:0 0 0 6px rgba(25,0,255,0.08);">
        <div style="color:#6b7280;font-size:20px;margin-bottom:14px;">Hours logged this week</div>
        <div style="font-family:'Avant Gothic','Inter',sans-serif;font-size:54px;font-weight:600;color:#1900ff;">184.5</div>
      </div>
      <div style="flex:1;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:32px;">
        <div style="color:#6b7280;font-size:20px;margin-bottom:14px;">Pending timesheets</div>
        <div style="font-family:'Avant Gothic','Inter',sans-serif;font-size:54px;font-weight:600;color:#111827;">2</div>
      </div>
    </div>
  </div>

  <!-- bottom scrim for caption legibility -->
  <div style="position:absolute;left:0;right:0;bottom:0;height:260px;background:linear-gradient(0deg, rgba(5,7,15,0.85), rgba(5,7,15,0));"></div>
  <div class="safe-caption">
    <div class="caption">One place for every hour, every project.</div>
  </div>
</div>
</body></html>
