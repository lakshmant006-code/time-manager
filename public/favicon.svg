<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 160" width="288" height="160">
  <style>
    .fill-mark { display: none; }
    @media (prefers-color-scheme: dark) {
      .outline-mark { display: none; }
      .fill-mark { display: block; }
    }
  </style>
  <g class="outline-mark">
    <circle cx="144" cy="160" r="110" fill="none" stroke="#000" stroke-width="34" />
    <text x="144" y="146" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="500" letter-spacing="2" fill="#000">SUMMER</text>
  </g>
  <g class="fill-mark">
    <circle cx="144" cy="160" r="160" fill="#000" />
    <text x="144" y="146" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="500" letter-spacing="2" fill="#fff">SUMMER</text>
  </g>
</svg>
